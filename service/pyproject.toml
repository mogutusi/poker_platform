[project]
name = "texas-holdem"
version = "0.1.0"
description = ""
authors = [
    {name = "wzx9126@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.118.2,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "psycopg (>=3.2.10,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "ttxsgm (==0.1.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "websockets (>=15.0.1,<16.0.0)",
    "treys (>=0.1.8,<0.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
ttxsgm = { path = "../lib/ttxsgm",  develop = false }

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
