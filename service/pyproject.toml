[project]
name = "texas-holdem"
version = "0.1.0"
description = ""
authors = [
    {name = "wzx9126@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.118.2,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "psycopg (>=3.2.10,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "ttxsgm (==0.1.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "websockets (>=15.0.1,<16.0.0)",
    "treys (>=0.1.8,<0.2.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
ttxsgm = { path = "../lib/ttxsgm",  develop = false }

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # 仅忽略 **aiosqlite 连接 worker 线程**(线程名 `_connection_worker_thread`)在 teardown 抛出的未处理异常告警:
    # 测试事件循环关闭后、内存 sqlite 引擎未 dispose 即被 GC,worker 线程触 "Event loop is closed"。纯测试期噪声
    # (引擎累积;生产 lifespan.stop 正常 engine.dispose,非代码缺陷)。message 锚定该线程名 ⇒ 不掩盖**其它线程**的异常
    # (该 worker 仅做 sqlite IO,真故障会经操作/断言失败暴露,不会被这条 teardown 告警吞)。
    # 彻底消除需给各测试引擎补 dispose(0028 起既有 helper 模式),留作专项测试卫生清理(见 changes/0039 自 review)。
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]
